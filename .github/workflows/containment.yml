name: Containment

# The containment claim is proven here rather than described. The work machine has
# virtualization disabled in BIOS, so Docker cannot run locally and the three proof tests
# skip there. On this runner they must run: REQUIRE_DOCKER=1 turns a missing daemon into a
# failure, so a green build means the sandbox was actually exercised.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  containment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --quiet pytest

      - name: Confirm a Docker daemon is reachable
        run: docker info --format '{{.ServerVersion}}'

      - name: Pull the sandbox image
        run: docker pull --quiet python:3.12-slim

      - name: Install OPA, because the golden path gates evaluate real policy
        run: |
          curl -sSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version

      - name: Run the suite, with the containment tests required
        env:
          REQUIRE_DOCKER: "1"
          REQUIRE_OPA: "1"
        run: python -m pytest -q -rs

      # The gate is a control rather than a library, so it has to run against a real trail on
      # every change, not only against fixtures inside the suite. The golden path writes the
      # trail, the gate then has to clear it, and a non-zero exit stops the build.
      - name: Walk the golden path, which writes a trail
        run: python -m golden_path.new_agent ci-probe

      - name: Audit gate
        run: python -m trail.gate

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -sSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version

      - name: Check the policy is well formed
        run: opa fmt --fail --diff policy/

      - name: Run the guardrail tests
        run: opa test policy/ -v
